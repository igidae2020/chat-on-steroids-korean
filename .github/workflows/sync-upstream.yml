name: Update Korean distribution

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: korean-upstream-update
  cancel-in-progress: false

jobs:
  update:
    # This workflow must never publish from an accidental third-party fork.
    if: github.repository == 'igidae2020/chat-on-steroids-korean'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Merge the newest official release without replacing local changes
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh api repos/totec448-spec/chat-on-steroids/releases/latest --jq .tag_name)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid upstream release tag'; exit 1; }
          git remote add upstream https://github.com/totec448-spec/chat-on-steroids.git
          git fetch --no-tags upstream main:refs/remotes/upstream/main "refs/tags/$tag:refs/remotes/upstream/releases/$tag"
          commit="$(git rev-parse "refs/remotes/upstream/releases/$tag^{commit}")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Ancestry decides whether official changes are new. Distribution numbers have
          # their own sequence. The helper only resolves version fields and preserves
          # published notes on the exact incoming release-note add/add collision.
          node scripts/korean-release.mjs "$commit" "$tag"
      - name: Install exact dependencies
        if: steps.upstream.outputs.changed == 'true'
        run: npm ci
      - name: Verify the merged source
        if: steps.upstream.outputs.changed == 'true'
        run: npm run verify
      - name: Publish source and dispatch the existing native release gates
        if: steps.upstream.outputs.changed == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.release_tag }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "v$(node -p "require('./package.json').version")" = "$TAG"
          # Commit only after verification. The helper never publishes or moves tags.
          git commit -m "Release $TAG from official $UPSTREAM_TAG"
          # One ordinary atomic push: concurrent main changes or an existing tag refuse it.
          git tag "$TAG"
          git push --atomic origin HEAD:main "refs/tags/$TAG"
          # A GITHUB_TOKEN push does not start another workflow automatically; dispatch is explicit.
          gh workflow run publish.yml --ref "$TAG"
