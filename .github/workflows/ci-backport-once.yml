name: Prepare isolated CI test backport

on:
  push:
    branches: [maintenance/ci-backport-20260914]
    paths: [.github/workflows/ci-backport-once.yml]

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'igidae2020/chat-on-steroids-korean'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Backport only the two reviewed test commits
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/maintenance/ci-backport-20260914
          test -z "$(git status --porcelain)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick --no-commit 669c88178703b69dae2cc2333932e8b1a3fcf9e2 f5c0f0023d05b75a87c357e63cdc9e53b21716f8
          git diff --cached --check
          git diff --cached --exit-code -- . ':!test/bridge.test.ts' ':!test/mcp-shutdown.test.ts'
          git diff --cached --stat
          git commit -m 'test: backport durable compaction and shutdown request race fixes'
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "BACKPORT_COMMIT=$(git rev-parse HEAD)"
          echo "BRIDGE_BLOB=$(git rev-parse HEAD:test/bridge.test.ts)"
          echo "SHUTDOWN_BLOB=$(git rev-parse HEAD:test/mcp-shutdown.test.ts)"
